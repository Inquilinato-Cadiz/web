name: Actualizar datos

on:
  schedule:
    - cron: "17 5 1 * *" # día 1 de cada mes, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # para lanzar Deploy: un push con GITHUB_TOKEN no dispara otros workflows

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data
      - run: npm run historico
      - run: npm run poblacion
      - run: npm run indices
      - run: npm run demanda
      - run: npm run desahucios
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/municipios src/data/municipios.json src/data/stats.json src/data/indices.json src/data/demanda.json src/data/desahucios.json src/data/historico.json src/data/poblacion.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Datos OpenRTA, índices INE, demanda de VPO y desahucios $(date -u +%Y-%m-%d)"
            # main puede haber avanzado durante la descarga (unos minutos); los
            # datos sólo los toca este workflow, así que el rebase no choca.
            git pull --rebase
            git push
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
